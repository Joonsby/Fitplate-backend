name: Deploy Fitplate Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

run-name: Deploy main backend

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, fitplate-prod]

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync prod source
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.gradle' \
            ./ /home/joonsby/apps/fitplate-backend/

      - name: Deploy prod
        working-directory: /home/joonsby/apps/fitplate-backend
        run: |
          docker compose -f docker-compose.prod.yml up -d --build
          docker ps

      - name: Wait for backend
        run: |
          sleep 10

      - name: Show backend logs
        run: |
          docker logs --tail=50 fitplate-backend-prod          

      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            http://localhost:8080/swagger-ui/index.html
