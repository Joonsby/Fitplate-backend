name: Deploy Fitplate Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

run-name: Deploy main backend

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, fitplate-prod]

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync prod source
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.gradle' \
            ./ /home/joonsby/apps/fitplate-backend/

      - name: Deploy prod
        working-directory: /home/joonsby/apps/fitplate-backend
        run: |
          docker compose \
          --env-file /home/joonsby/secrets/fitplate-prod.env \
          -f docker-compose.prod.yml \
          up -d --build
          
          docker ps

      - name: Show backend logs
        run: |
          docker logs --tail=50 fitplate-backend-prod          

      - name: Health check
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:8080/swagger-ui/index.html; then
              echo "Backend is healthy"
              exit 0
            fi
          
            echo "Waiting for backend... ($i/20)"
            sleep 3
          done
          
          echo "Backend health check failed"
          docker logs --tail=200 fitplate-backend-prod
          exit 1

      - name: Show backend logs
        if: always()
        run: |
          docker logs --tail=200 fitplate-backend-prod          
